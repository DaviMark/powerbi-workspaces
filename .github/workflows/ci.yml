name: governance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Testes do CLI
        run: python -m unittest discover -s _sistema/testes -v
      - name: Segredos e arquivos com dados
        run: python _sistema/pbw.py seguranca
      - name: Governança (estrutura, modelo, documentação)
        run: python _sistema/pbw.py validar
      - name: Catálogo atualizado
        if: runner.os == 'Linux'
        run: |
          python _sistema/pbw.py catalogo
          git diff --exit-code -- dashboards/CATALOGO.md dashboards/catalogo.json || (echo "::error::Rode 'pbw catalogo' e faça commit." && exit 1)

  schemas:
    name: PBIR/PBIP vs schemas oficiais da Microsoft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Schemas oficiais (microsoft/json-schemas)
        run: git clone --depth 1 https://github.com/microsoft/json-schemas.git /tmp/json-schemas
      - name: Gerar um dashboard novo e validar tudo
        run: |
          pip install "jsonschema>=4.18"
          python _sistema/pbw.py novo "Ci/Teste/Schema/Painel" --force
          python _sistema/testes/check_schemas.py /tmp/json-schemas
